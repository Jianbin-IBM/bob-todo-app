<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, responsive todo application">
    <title>Todo App - Stay Organized</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="icon">✓</span>
                    Todo App
                </h1>
                <p class="app-subtitle">Stay organized, get things done</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Add Todo Form -->
            <section class="add-todo-section">
                <form id="todo-form" class="todo-form">
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="todo-title" 
                            class="input-field" 
                            placeholder="What needs to be done?" 
                            maxlength="200"
                            required
                            autocomplete="off"
                        >
                        <textarea 
                            id="todo-description" 
                            class="input-field textarea-field" 
                            placeholder="Add a description (optional)" 
                            maxlength="500"
                            rows="2"
                        ></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <span class="btn-icon">+</span>
                        Add Todo
                    </button>
                </form>
            </section>

            <!-- Filter Tabs -->
            <section class="filter-section">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">
                        All <span class="count" id="count-all">0</span>
                    </button>
                    <button class="filter-tab" data-filter="active">
                        Active <span class="count" id="count-active">0</span>
                    </button>
                    <button class="filter-tab" data-filter="completed">
                        Completed <span class="count" id="count-completed">0</span>
                    </button>
                </div>
            </section>

            <!-- Todo List -->
            <section class="todo-list-section">
                <div id="todo-list" class="todo-list">
                    <!-- Todos will be dynamically inserted here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <h3>No todos yet!</h3>
                    <p>Add your first todo above to get started</p>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading todos...</p>
                </div>
            </section>

            <!-- Error Message -->
            <div id="error-message" class="error-message" style="display: none;">
                <span class="error-icon">⚠️</span>
                <span class="error-text"></span>
                <button class="error-close" onclick="hideError()">×</button>
            </div>

            <!-- Success Message -->
            <div id="success-message" class="success-message" style="display: none;">
                <span class="success-icon">✓</span>
                <span class="success-text"></span>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Built with ❤️ using Flask & JavaScript</p>
            <p class="footer-links">
                <a href="https://github.com" target="_blank">GitHub</a>
                <span>•</span>
                <a href="#" onclick="clearAllCompleted(); return false;">Clear Completed</a>
            </p>
        </footer>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Todo</h2>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="edit-form">
                    <input type="hidden" id="edit-todo-id">
                    <div class="form-group">
                        <label for="edit-todo-title">Title</label>
                        <input 
                            type="text" 
                            id="edit-todo-title" 
                            class="input-field" 
                            maxlength="200"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="edit-todo-description">Description</label>
                        <textarea 
                            id="edit-todo-description" 
                            class="input-field textarea-field" 
                            maxlength="500"
                            rows="3"
                        ></textarea>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
